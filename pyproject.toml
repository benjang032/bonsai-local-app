[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bonsai-local-demo"
version = "0.1.0"
description = "Small local Bonsai Image 4B demo for Apple Silicon Macs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "huggingface-hub>=0.32",
    "hf-transfer>=0.1.9",
    "mcp>=1.0",
    "pillow>=10",
    "mflux>=0.17.0 ; sys_platform == 'darwin'",
    "prism-image-studio ; sys_platform == 'darwin'",
]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
mflux = { path = "vendor/mflux-prism", editable = true }
prism-image-studio = { path = "vendor/image-studio", editable = true }

[tool.setuptools.packages.find]
include = ["bonsai_demo*"]
